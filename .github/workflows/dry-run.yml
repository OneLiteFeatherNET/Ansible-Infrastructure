name: Dry Run Ansible Playbook Bedrock

on:
  pull_request:
    paths:
      - 'bedrock.yml'
      - 'bedrock/**'

jobs:
  dry-run:
    name: Dry Run Ansible Playbook Bedrock
    runs-on: [self-hosted, Linux, X64, ansible]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Ansible
        uses: dawidd6/action-ansible-playbook@v3
        with:
          version: '2.11'
      - name: Install Ansible Galaxy Roles
        run: ansible-galaxy install -r requirements.yml
      - name: Decrypt Ansible Vault
        run: echo $ANSIBLE_VAULT_PASSWORD > .vault-password
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      - name: Run Ansible Playbook
        run: ansible-playbook -i inventory-vault.yml bedrock.yml --check
